[project]
name = "forwarder-backend"
version = "0.1.0"
description = "Ivan - AI assistant for freight forwarders (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "httpx>=0.27",
    "tzdata>=2024.1", # IANA timezones on Windows (Europe/Sofia)
    "anthropic>=1.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
